# Alembic config — ADR-0002. Invoke from repo root:
#   alembic -c infrastructure/db/alembic.ini upgrade head
# The database URL is NEVER stored here (20 §5): env.py reads DATABASE_URL
# from the environment at runtime; offline SQL generation uses a placeholder.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
