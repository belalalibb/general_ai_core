# AI Orchestration Platform — monorepo config
# Stack authority: engineering/adr/ADR-0001-implementation-stack.md (ACCEPTED)
# Layout authority: docs/ai_orchestration_pack/final_docs_v3/41_IMPLEMENTATION_PLAN_AND_MVP.md §2

[project]
name = "ai-orchestration-platform"
version = "0.1.0"
description = "General AI Core / AI Orchestration Platform (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    # Persistence toolchain — ADR-0002 (ACCEPTED 2026-08-25)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.2",
    # Redis binding — ADR-0003 (ACCEPTED 2026-08-25)
    "redis>=5",
    # Observability — ADR-0004 (ACCEPTED 2026-08-25). OTLP exporter DEFERRED
    # until a collector exists (per ADR); dev/test = console/no-op exporters.
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core"]

# Architecture boundary tests (40 §6.2): Core / Infrastructure / Providers never mix.
# Enforced by import-linter; CI runs the same entry point as local (check_repo.sh).
[tool.importlinter]
root_packages = ["apps", "core", "providers", "infrastructure"]
# Required for forbidding EXTERNAL packages (ADR-0002+ toolchain contracts).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is pure: core must not import apps, providers, or infrastructure"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps", "providers", "infrastructure"]

[[tool.importlinter.contracts]]
name = "Contracts import no implementation (41 Phase 1 rule)"
type = "forbidden"
source_modules = ["core.contracts"]
forbidden_modules = ["apps", "providers", "infrastructure"]

[[tool.importlinter.contracts]]
name = "Providers must not import apps or infrastructure"
type = "forbidden"
source_modules = ["providers"]
forbidden_modules = ["apps", "infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import apps or providers"
type = "forbidden"
source_modules = ["infrastructure"]
forbidden_modules = ["apps", "providers"]

# ADR-0002: persistence toolchain confined to infrastructure/ — core purity.
[[tool.importlinter.contracts]]
name = "Core must not import the persistence toolchain (ADR-0002)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["sqlalchemy", "alembic", "asyncpg", "pgvector"]

# ADR-0003: Redis client confined to infrastructure/ — core keeps port fakes.
[[tool.importlinter.contracts]]
name = "Core must not import the Redis client (ADR-0003)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["redis"]

# ADR-0004: telemetry SDK/log pipeline confined to apps/ composition root
# (+ infrastructure instrumentation later) — core purity.
[[tool.importlinter.contracts]]
name = "Core must not import the telemetry stack (ADR-0004)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["opentelemetry", "structlog"]
